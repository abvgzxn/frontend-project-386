name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
        with:
          version: 2026.11.8
      - run: mise run install
      - run: npx playwright install --with-deps chromium
      - run: mise run check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --tag call-calendar:ci .
      - run: docker run --detach --name call-calendar-ci --publish 18080:3000 call-calendar:ci
      - run: node scripts/docker-smoke.mjs http://127.0.0.1:18080
      - if: always()
        run: docker rm --force call-calendar-ci
